<!DOCTYPE html>
<html lang="hr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arhiva DIGEL Ispita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1a1f2e' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .card-glow:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, .06);
        }

        .fade-in {
            animation: fadeIn .3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .glass {
            background: rgba(30, 41, 59, .6);
            backdrop-filter: blur(12px);
        }

        .table-pre {
            font-family: monospace;
        }

        table.logic-table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.875rem;
        }

        table.logic-table th,
        table.logic-table td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px;
        }

        table.logic-table th {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-slate-950 text-gray-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navbar -->
    <header class="glass border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                    <div
                        class="w-9 h-9 rounded-xl bg-violet-600 flex items-center justify-center mr-3 hover:bg-violet-500 transition-colors">
                        <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-white">Nazad na Kviz</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-slate-400 text-sm font-medium">Baza Znanja - Digitalna Elektronika</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Arhiva Zadataka</h1>
            <p class="text-slate-400">Pretražite sve izvučene zadatke iz prošlih ispita digitalne elektronike i sustava.
            </p>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-8">
            <input type="text" id="search-input" placeholder="Pretraži po tekstu zadatka, ispitu ili ključnoj riječi..."
                class="w-full bg-slate-900/80 border border-white/10 text-white rounded-xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all shadow-lg text-lg">
            <svg class="absolute left-4 top-4.5 h-6 w-6 text-slate-500" style="top: 16px;" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <div class="absolute right-4 top-4 text-sm text-slate-500 font-medium" id="result-count">0 zadataka</div>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-violet-500 mb-4">
            </div>
            <p class="text-slate-400">Učitavanje baze zadataka...</p>
        </div>

        <!-- Cards Grid -->
        <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <!-- Image Modal -->
    <div id="image-modal"
        class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 transition-opacity">
        <button onclick="closeModal()"
            class="absolute top-6 right-6 text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 p-2 rounded-xl transition-all">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div
            class="max-w-5xl w-full max-h-[90vh] flex flex-col bg-slate-900 border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
                <h3 id="modal-title" class="text-lg font-bold text-white">Izvorni Ispit</h3>
            </div>
            <div class="flex-grow overflow-auto p-4 bg-slate-950/50 flex justify-center items-center">
                <img id="modal-image" src="" alt="Scan ispita" class="max-w-full h-auto rounded-lg shadow-lg"
                    style="max-height: 75vh; object-fit: contain;">
            </div>
        </div>
    </div>

    <script>
        let allQuestions = [];

        async function init() {
            try {
                const res = await fetch('quiz/digel_db.json');
                allQuestions = await res.json();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('questions-grid').classList.remove('hidden');
                renderCards(allQuestions);
            } catch (e) {
                console.error("Error loading DB", e);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Greška pri učitavanju baze zadataka.</p>';
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allQuestions.filter(q => {
                return (q.text && q.text.toLowerCase().includes(term)) ||
                    (q.exam && q.exam.toLowerCase().includes(term));
            });
            renderCards(filtered);
        });

        function parseTable(tableStr) {
            if (!tableStr) return '';
            const rows = tableStr.trim().split('\n');
            let html = '<div class="overflow-x-auto mt-4"><table class="logic-table">';
            rows.forEach((row, idx) => {
                const isHeader = idx === 0;
                const cols = row.split('|').map(c => c.trim());
                html += '<tr>';
                cols.forEach(col => {
                    const cellTag = isHeader ? 'th' : 'td';
                    html += `<${cellTag} class="font-mono text-xs ${isHeader ? 'text-violet-300' : 'text-slate-300'}">${col}</${cellTag}>`;
                });
                html += '</tr>';
            });
            html += '</table></div>';
            return html;
        }

        function renderCards(questions) {
            const grid = document.getElementById('questions-grid');
            document.getElementById('result-count').textContent = `${questions.length} zadataka`;
            grid.innerHTML = '';

            const frag = document.createDocumentFragment();

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/80 rounded-2xl p-6 border border-white/5 hover:border-violet-500/30 transition-all shadow-lg card-glow flex flex-col h-full";

                let bodyHtml = `<p class="text-slate-200 mt-4 text-sm leading-relaxed">${q.text.replace(/\\overline{([^}]+)}/g, '<span class="overline">$1</span>').replace(/_(\d+)/g, '<sub>$1</sub>').replace(/\\^(\S+)/g, '<sup>$1</sup>')}</p>`;

                if (q.table) {
                    bodyHtml += parseTable(q.table);
                }

                let badgesHtml = '';
                if (q.has_diagram) {
                    badgesHtml += `<span class="inline-flex items-center gap-1 bg-amber-900/30 text-amber-400 px-2 py-1 rounded-md text-xs font-medium border border-amber-700/30 mt-3"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg> Zahtijeva dijagram</span> `;
                }

                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-violet-900/50 text-violet-300 text-xs font-bold px-2.5 py-1 rounded-lg border border-violet-700/50 uppercase tracking-widest">${q.exam}</span>
                            <span class="text-slate-500 text-xs font-mono">#${q.question_number}</span>
                        </div>
                        ${bodyHtml}
                        <div class="flex flex-wrap gap-2">
                            ${badgesHtml}
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-white/5">
                        <button onclick="openModal('digelispiti_images/${q.source_image}', '${q.exam} - Zadatak ${q.question_number}')" class="w-full bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white py-2 px-4 rounded-xl font-medium transition-all text-sm border border-white/5 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
                            Prikaži izvornu sliku
                        </button>
                    </div>
                `;
                frag.appendChild(card);
            });

            grid.appendChild(frag);
        }

        function openModal(imgSrc, title) {
            document.getElementById('modal-image').src = imgSrc;
            document.getElementById('modal-title').textContent = title;
            const modal = document.getElementById('image-modal');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-image').src = '';
        }

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.onload = init;
    </script>
    <style>
        .overline {
            text-decoration: overline;
        }
    </style>
</body>

</html>
